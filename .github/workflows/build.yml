# Everlastingness Client — Continuous Integration
#
# Builds the launcher (dotnet publish, per-OS) and the client jars
# (legacy :v1_7_10 reobf + modern :v1_20_x remap/reobf/package), then uploads
# them as build artifacts. A release tag publishes a GitHub Release.
#
# Toolchains required by the client builds are auto-provisioned:
#  - RFG setup needs a JDK 8 toolchain to compile 1.7.10 and a JDK 17+ for
#    Fernflower decompile (foojay resolver auto-downloads the missing JDK).
#  - Loom needs Gradle 9.5+ (the wrapper in client-modern/ pins 9.5.1).

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Launcher (.NET 8 + Avalonia)
  # ---------------------------------------------------------------------------
  launcher:
    name: Launcher (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore launcher/Everlastingness.Launcher.sln

      - name: Build
        run: dotnet build launcher/Everlastingness.Launcher.sln --configuration Release --no-restore

      - name: Publish (self-contained, single-file)
        run: |
          dotnet publish launcher/Everlastingness.Launcher/Everlastingness.Launcher.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -o publish/${{ matrix.rid }}

      - name: Zip publish output
        shell: bash
        run: |
          mkdir -p artifacts
          7z a -tzip artifacts/Everlastingness-Launcher-${{ matrix.rid }}.zip ./publish/${{ matrix.rid }}/* || \
            (cd publish/${{ matrix.rid }} && zip -r ../../../artifacts/Everlastingness-Launcher-${{ matrix.rid }}.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.rid }}
          path: artifacts/Everlastingness-Launcher-${{ matrix.rid }}.zip

  # ---------------------------------------------------------------------------
  # Unit tests (common framework: EventBus, KeybindManager, Module lifecycle)
  # ---------------------------------------------------------------------------
  tests:
    name: Unit tests (:common)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run :common unit tests
        working-directory: client
        run: ./gradlew :common:test --no-daemon

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: common-test-report
          path: client/common/build/reports/tests/

  # ---------------------------------------------------------------------------
  # Client — legacy (1.7.10) on Gradle 8.8 / RFG
  # ---------------------------------------------------------------------------
  client-legacy:
    name: Client :v1_7_10 (RFG reobf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21 (build) — foojay provisions JDK 8/17 toolchains
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build :v1_7_10 (setupDecompWorkspace + reobfJar)
        working-directory: client
        run: ./gradlew :v1_7_10:reobfJar --no-daemon --stacktrace

      - name: Collect reobf jar
        run: |
          mkdir -p artifacts/client-legacy
          cp client/v1_7_10/build/libs/*.jar artifacts/client-legacy/

      - uses: actions/upload-artifact@v4
        with:
          name: client-legacy
          path: artifacts/client-legacy

  # ---------------------------------------------------------------------------
  # Client — modern (1.20.x) on Gradle 9.5 / Loom
  # ---------------------------------------------------------------------------
  client-modern:
    name: Client :v1_20_x (Loom remap + reobf + agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21 (Loom 1.17 requires Java 21 to run Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build :v1_20_x (remapJar + reobfJar + packageAgent)
        working-directory: client-modern
        run: ./gradlew :v1_20_x:packageAgent --no-daemon --stacktrace

      - name: Collect agent + reobf jars
        run: |
          mkdir -p artifacts/client-modern
          cp client-modern/v1_20_x/build/libs/*.jar artifacts/client-modern/

      - uses: actions/upload-artifact@v4
        with:
          name: client-modern
          path: artifacts/client-modern

  # ---------------------------------------------------------------------------
  # Release: when a v* tag is pushed, assemble a GitHub Release with all jars +
  # the launcher zips. (Windows installer is produced separately; see
  # scripts/build-windows-installer.ps1.)
  # ---------------------------------------------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [launcher, tests, client-legacy, client-modern]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release

      - name: Flatten artifacts
        run: |
          mkdir -p out
          find release -type f \( -name '*.jar' -o -name '*.zip' \) -exec cp {} out/ \;
          ls -la out

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          draft: true
