# Everlastingness modern client — shared Gradle properties.

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
# Config-cache is buggy with Loom; keep off.
org.gradle.configuration-cache=false

# === Fabric toolchain ===
# Fabric Maven no longer hosts older Loom (<1.14); we use the current line.
# Loom 1.17.x requires Gradle 9.5+ (wrapper pinned to 9.5.1).
loom_version=1.17.19

# === Minecraft / mappings / loader (MC 1.20.1) ===
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
# Loader 0.16.x is the well-tested broadly-compatible line. We only use it for
# the dev environment; the production jar is injected standalone, NOT run under
# Fabric Loader.
loader_version=0.12.12
# Sponge-mixin paired with loader 0.16.x for the Mixin annotation processor.
sponge_mixin_version=0.15.5+mixin.0.8.7

# === Mod metadata ===
mod_version=1.0.0
maven_group=net.everlastingness
